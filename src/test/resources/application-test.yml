DB_URL: jdbc:h2:mem:testdb
DB_USERNAME: sa
DB_PASSWORD:

REDIS_HOST: localhost
REDIS_PORT: 6379

MAIL_USERNAME: test
MAIL_PASSWORD: test

JWT_SECRET: dummy-test-secret

KAKAO_CLIENT_ID: dummy-test-client-id
KAKAO_CLIENT_SECRET: dummy-test-client-secret

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration




  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: dummy-test-client-id
            client-secret: dummy-test-client-secret
            redirect-uri: http://localhost/test
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  mail:
    host: dummy
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
jwt:
  secret: dummy-test-secret
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000