management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: basketball-matching

    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

      slo:
        "[http.server.requests]":
          - 100ms
          - 300ms
          - 500ms
          - 1s
          - 3s