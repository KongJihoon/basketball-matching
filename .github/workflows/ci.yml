name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-tests:
    name: User Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run User tests
        run: |
          ./gradlew clean test \
            --tests "com.example.basketballmatching.user.service.UserServiceUnitTest" \
            --tests "com.example.basketballmatching.user.service.UserWithdrawalServiceTest" \
            --tests "com.example.basketballmatching.user.service.UserServiceIntegrationTest" \
            --tests "com.example.basketballmatching.user.service.UserWithdrawalServiceIntegrationTest"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore

  build:
    name: Build Application
    needs:
      - user-tests

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build executable JAR
        run: ./gradlew clean bootJar -x test