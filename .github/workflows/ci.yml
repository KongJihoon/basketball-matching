name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ 여기서 환경변수 주입 (중요!!)
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:mysql://127.0.0.1:3306/basketball?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: basketball
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          printf "%s\n" "${{ secrets.APPLICATION }}" > src/main/resources/application.yml
          cat src/main/resources/application.yml

      - name: Create application-test.yml
        run: |
          mkdir -p src/test/resources
          printf "%s\n" "${{ secrets.APPLICATION_TEST }}" > src/test/resources/application-test.yml
          cat src/test/resources/application-test.yml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ 테스트 포함
      - name: Build with tests
        run: ./gradlew clean test --stacktrace
